<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undo-Redo Stack</title>
</head>
<body>
    <div>
        <input type="text" placeholder="Enter text here" id="textBtnInput">
        <p id="errorMsg"></p>
        <button id="addActionBtn">Add Action</button>


        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>
    </div>

    <div>
        <h3>Current State:</h3>
        <p id="currentText"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
